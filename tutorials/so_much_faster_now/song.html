<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>So Much Faster Now, E Major — Practice App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d0d16;
      --surface:    #1a1a2e;
      --surface2:   #16213e;
      --border:     #243358;
      --accent:     #e94560;
      --accent-dim: rgba(233, 69, 96, 0.18);
      --text:       #f0f0f5;
      --muted:      #5a6480;
      --radius:     14px;
      --font:       'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
      gap: 1.5rem;
    }

    /* ── Header ── */
    header { text-align: center; }
    .lj-logo {
      width: 180px; height: auto;
      display: block; margin: 0 auto 0.8rem;
      filter: drop-shadow(0 2px 12px rgba(233,69,96,0.15));
    }
    header h1 {
      font-size: 1.05rem; letter-spacing: 0.25em;
      text-transform: uppercase; color: var(--accent); font-weight: 700;
    }
    header p { font-size: 0.78rem; color: var(--muted); margin-top: 0.25rem; }

    /* ── Player card ── */
    .player-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem 1.75rem;
      width: 100%; max-width: 1100px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; gap: 1rem;
    }
    audio { width: 100%; accent-color: var(--accent); }
    .speed-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .speed-label {
      font-size: 0.7rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); margin-right: 0.2rem;
    }
    .speed-btn {
      background: var(--surface2); color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.35rem 0.9rem; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: background .15s, color .15s, border-color .15s;
    }
    .speed-btn:hover { background: var(--accent-dim); color: var(--text); }
    .speed-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Controls row (dropdowns) */
    .ctrl-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .ctrl-row .speed-label { white-space: nowrap; }
    .ctrl-row select {
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.35rem 0.7rem; font-size: 0.82rem; font-family: var(--font);
      cursor: pointer; outline: none; transition: border-color .15s;
    }
    .ctrl-row select:hover, .ctrl-row select:focus { border-color: var(--accent); }

    /* ── Two-column layout ── */
    .main-cols {
      width: 100%; max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 700px) {
      .main-cols { grid-template-columns: 1fr; }
    }

    /* ── LEFT: Bass panel ── */
    .bass-panel {
      display: flex; flex-direction: column; gap: 1rem;
    }

    .now-playing {
      background: var(--surface); border: 2px solid var(--accent);
      border-radius: var(--radius); padding: 1.75rem 1.5rem 1.5rem;
      text-align: center;
      box-shadow: 0 0 60px rgba(233,69,96,0.12), inset 0 0 60px rgba(233,69,96,0.03);
    }
    .section-label {
      font-size: 0.7rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem;
    }
    #currentChord {
      font-size: clamp(3rem, 10vw, 5.5rem); font-weight: 900; line-height: 1;
      color: var(--accent); text-shadow: 0 0 40px rgba(233,69,96,0.5);
      letter-spacing: -0.02em; margin-bottom: 0.4rem;
      transition: color 0.2s; min-height: 1.1em;
    }

    /* Fretboard */
    .fretboard-wrap { margin: 0.75rem 0 0.6rem; }
    #fretboard svg { display: block; width: 100%; max-width: 280px; height: auto; margin: 0 auto; overflow: visible; }
    .fretboard-legend { display: flex; gap: 1.2rem; justify-content: center; margin-top: 0.5rem; }
    .legend-item { display: flex; align-items: center; gap: 0.35rem; font-size: 0.68rem; color: var(--muted); }
    .legend-pip { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-pip.root    { background: #e94560; }
    .legend-pip.third   { background: #22c55e; }
    .legend-pip.fifth   { background: #2563eb; }
    .legend-pip.seventh { background: #eab308; }
    .legend-pip.open    { background: transparent; border: 1.5px solid var(--muted); }

    /* Note pills */
    .notes-list { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; min-height: 2rem; }
    .note-pill {
      background: var(--accent-dim); border: 1px solid var(--accent);
      border-radius: 999px; padding: 0.35rem 1rem;
      font-size: 0.88rem; font-weight: 600; color: var(--text); white-space: nowrap;
    }
    .note-pill.waiting {
      border-color: var(--border); background: transparent;
      color: var(--muted); font-style: italic; font-weight: 400;
    }

    /* Countdown */
    .countdown-track {
      height: 5px; background: var(--surface2); border-radius: 3px;
      overflow: hidden; margin-top: 1.25rem;
    }
    .countdown-fill {
      height: 100%; background: var(--accent); width: 100%;
      border-radius: 3px; transition: width 0.25s linear;
    }

    /* Up next */
    .up-next {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem 1.25rem;
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    .up-next .section-label { margin-bottom: 0; flex-shrink: 0; min-width: 3.5rem; }
    #nextChord { font-size: 1.7rem; font-weight: 800; color: var(--muted); flex-shrink: 0; }
    .next-notes { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .next-note-pill {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--muted); border-radius: 999px; padding: 0.18rem 0.7rem; font-size: 0.78rem;
    }

    /* ── RIGHT: Karaoke panel ── */
    .karaoke-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem 1.5rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    .karaoke-label {
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.75rem;
    }
    #lyrics-scroll {
      max-height: 420px; overflow-y: auto; scroll-behavior: smooth;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    #lyrics-scroll::-webkit-scrollbar { width: 4px; }
    #lyrics-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .seg {
      display: flex; align-items: baseline; gap: 0.8rem;
      padding: 0.55rem 0.5rem; border-radius: 8px;
      transition: background 0.2s, box-shadow 0.2s; margin-bottom: 0.1rem;
    }
    .seg-chord {
      min-width: 2.8rem; font-size: 1.2rem; font-weight: 900;
      color: var(--muted); letter-spacing: -0.01em;
      flex-shrink: 0; transition: color 0.2s; text-align: right;
    }
    .seg-text { font-size: 1rem; line-height: 1.5; color: var(--muted); transition: color 0.2s; }

    .seg.active { background: var(--accent-dim); box-shadow: inset 3px 0 0 var(--accent); }
    .seg.active .seg-chord { color: var(--accent); text-shadow: 0 0 18px rgba(233,69,96,0.5); }
    .seg.active .seg-text  { color: var(--text); font-weight: 500; }

    .seg.past .seg-chord { color: #2a3248; }
    .seg.past .seg-text  { color: #2a3248; }
    .seg.upcoming .seg-chord { color: #3a4868; }
    .seg.upcoming .seg-text  { color: #3a4868; }
  </style>

      text.className = 'seg-text';
      text.textContent = seg.text;
      div.appendChild(chord);
      div.appendChild(text);
      lyricsEl.appendChild(div);
      return div;
    });

    // ── Speed controls ────────────────────────────────────────────────
    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        audio.playbackRate = parseFloat(btn.dataset.speed);
        audio.preservesPitch = true;
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // ── Control dropdowns ─────────────────────────────────────────────
    notesModeEl.addEventListener('change', () => {
      notesMode = notesModeEl.value;
      renderBassPanel(activeIndex);
    });
    instrumentEl.addEventListener('change', () => {
      instrument = instrumentEl.value;
      renderBassPanel(activeIndex);
    });
    capoEl.addEventListener('change', () => {
      capo = parseInt(capoEl.value);
      renderBassPanel(activeIndex);
    });

    // ── Core sync ─────────────────────────────────────────────────────
    audio.addEventListener('timeupdate', () => {
      const t = audio.currentTime;
      let idx = -1;
      for (let i = songData.length - 1; i >= 0; i--) {
        if (t >= songData[i].time) { idx = i; break; }
      }
      if (idx !== activeIndex) {
        activeIndex = idx;
        renderBassPanel(idx);
        renderLyrics(idx);
      }
      updateCountdown(idx, t);
    });

    audio.addEventListener('seeked',  () => { activeIndex = -2; });
    audio.addEventListener('ended',   () => {
      activeIndex = -1;
      currentChordEl.textContent = '\u2013';
      currentNotesEl.innerHTML = '<span class="note-pill waiting">Song ended \u2014 rewind to replay</span>';
      nextChordEl.textContent = '\u2013';
      nextNotesEl.innerHTML = '';
      countdownFill.style.width = '0%';
      segEls.forEach(el => { el.classList.remove('active', 'upcoming'); el.classList.add('past'); });
    });

    // ── Filter note pills to match dropdown mode ──────────────────────
    // notes array is always [Root, 3rd, 5th, 7th] — pick the right subset
    function filteredNotes(notes) {
      switch (notesMode) {
        case 'root':                   return [notes[0]];
        case 'root-fifth':             return [notes[0], notes[2]];
        case 'root-third-fifth':       return [notes[0], notes[1], notes[2]];
        case 'chord':                  return [notes[0], notes[1], notes[2]];
        default:                       return notes;   // all four
      }
    }

    // ── Bass panel ────────────────────────────────────────────────────
    function renderBassPanel(idx) {
      if (idx < 0) {
        currentChordEl.textContent = '\u2013';
        currentNotesEl.innerHTML = '';
        nextChordEl.textContent = songData[0]?.chord ?? '\u2013';
        renderNextNotes(0);
        fretboardEl.innerHTML = buildFretboardSVG(null, notesMode, instrument, capo);
        updateLegend(null, notesMode);
        return;
      }
      const entry  = songData[idx];
      const next   = songData[idx + 1];
      currentChordEl.textContent = entry.chord;
      currentNotesEl.innerHTML = filteredNotes(entry.notes).map(n => `<span class="note-pill">${n}</span>`).join('');
      const parsed = parseChord(entry.chord);
      fretboardEl.innerHTML = parsed ? buildFretboardSVG(parsed, notesMode, instrument, capo) : '';
      updateLegend(parsed, notesMode);
      if (next) { nextChordEl.textContent = next.chord; renderNextNotes(idx + 1); }
      else       { nextChordEl.textContent = '(End)';   nextNotesEl.innerHTML = ''; }
    }

    function renderNextNotes(idx) {
      const entry = songData[idx];
      if (!entry) { nextNotesEl.innerHTML = ''; return; }
      nextNotesEl.innerHTML = filteredNotes(entry.notes).map(n => `<span class="next-note-pill">${n}</span>`).join('');
    }

    function updateCountdown(idx, t) {
      if (idx < 0 || idx >= songData.length - 1) {
        countdownFill.style.width = idx < 0 ? '100%' : '0%';
        return;
      }
      const progress = (t - songData[idx].time) / (songData[idx+1].time - songData[idx].time);
      countdownFill.style.width = (100 - progress * 100).toFixed(1) + '%';
    }

    // ── Karaoke panel ─────────────────────────────────────────────────
    function renderLyrics(idx) {
      segEls.forEach((el, i) => {
        el.classList.remove('active', 'past', 'upcoming');
        if      (i < idx)  el.classList.add('past');
        else if (i === idx) el.classList.add('active');
        else                el.classList.add('upcoming');
      });
      // Scroll active segment into upper-third of panel
      if (idx >= 0 && segEls[idx]) {
        const containerRect = lyricsEl.getBoundingClientRect();
        const elRect        = segEls[idx].getBoundingClientRect();
        const relativeTop   = elRect.top - containerRect.top + lyricsEl.scrollTop;
        lyricsEl.scrollTo({ top: Math.max(0, relativeTop - lyricsEl.clientHeight * 0.25), behavior: 'smooth' });
      } else if (idx < 0) {
        lyricsEl.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // ── Fretboard SVG ─────────────────────────────────────────────────
    const NOTE_SEMITONE = {

    // Instrument configs — strings listed top→bottom as shown on the diagram

    function parseChord(name) {
      const m = name.match(/^([A-G][#b]?)[ ]*(Major|Minor|m)?/i);
      if (!m) return null;
      const root = NOTE_SEMITONE[m[1]];
      if (root === undefined) return null;
      const isMinor = m[2] && m[2].toLowerCase() === 'minor';
      return {
        name,
        rootSemitone:    root,
        thirdSemitone:   (root + (isMinor ? 3 : 4)) % 12,
        fifthSemitone:   (root + 7)                  % 12,
        seventhSemitone: (root + 10)                 % 12,  // b7 for both major and minor (convention: unqualified 7th = flat 7th)
        isMinor,
      };
    }

    // Return fret positions (0 = open/capo) for a given semitone, instrument and capo
    function getPositions(semitone, instr, capoFret) {
      return INSTRUMENTS[instr].strings.reduce((acc, open, sIdx) => {
        const effectiveOpen = (open + capoFret) % 12;
        const fret = (semitone - effectiveOpen + 12) % 12;
        if (fret <= 5) acc.push({ s: sIdx, fret });
        return acc;
      }, []);
    }

    // Which intervals are active for each mode
    function activeIntervals(mode) {
      switch (mode) {
        case 'root':                   return ['root'];
        case 'root-fifth':             return ['root', 'fifth'];
        case 'root-third-fifth':       return ['root', 'third', 'fifth'];
        case 'chord':                  return ['root', 'third', 'fifth'];
        default:                       return ['root', 'third', 'fifth', 'seventh'];
      }
    }

    function buildFretboardSVG(parsed, mode, instr, capoFret) {
      const cfg      = INSTRUMENTS[instr];
      const nStrings = cfg.strings.length;
      const W        = 280;
      const nutX     = 24, nutW = 4, fretW = 40, nFrets = 5, topPad = 18, dotR = 8;
      const strGap   = nStrings > 4 ? 13 : 16;
      const H        = topPad + (nStrings - 1) * strGap + 14;
      const openX    = nutX - 13;
      const fbRight  = nutX + nutW + nFrets * fretW;
      const strY     = cfg.strings.map((_, i) => topPad + i * strGap);
      const cx       = f => f === 0 ? openX : nutX + nutW + (f - 0.5) * fretW;
      const p = [];
      p.push(`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`);
      p.push(`<rect width="${W}" height="${H}" fill="#0d1117" rx="8"/>`);

      // Fret number labels — always relative to capo (1-5); capo bar shows actual position
      for (let f = 1; f <= nFrets; f++) {
        const x = nutX + nutW + (f - 0.5) * fretW;
        p.push(`<text x="${x}" y="11" text-anchor="middle" font-size="9" fill="#2d3f55">${f}</text>`);
      }

      // String name labels (right side)
      cfg.labels.forEach((lbl, i) =>
        p.push(`<text x="${fbRight+6}" y="${strY[i]+4}" text-anchor="start" font-size="9" font-weight="700" fill="#2d3f55">${lbl}</text>`));

      // Strings
      strY.forEach((y, i) =>
        p.push(`<line x1="${nutX+nutW}" y1="${y}" x2="${fbRight}" y2="${y}" stroke="#1a2d46" stroke-width="${cfg.widths[i]}"/>`));

      // Fret lines
      for (let f = 1; f <= nFrets; f++) {
        const x = nutX + nutW + f * fretW;
        p.push(`<line x1="${x}" y1="${strY[0]}" x2="${x}" y2="${strY[nStrings-1]}" stroke="#1a2d46" stroke-width="1"/>`);
      }

      // Nut or capo bar
      const nutTop = strY[0] - 6, nutBot = strY[nStrings-1] + 6;
      if (capoFret === 0) {
        p.push(`<rect x="${nutX}" y="${nutTop}" width="${nutW}" height="${nutBot-nutTop}" fill="#c0c8d8" rx="1"/>`);
      } else {
        p.push(`<rect x="${nutX}" y="${nutTop}" width="${nutW+2}" height="${nutBot-nutTop}" fill="#e94560" rx="2"/>`);
        p.push(`<text x="${nutX+(nutW/2)+1}" y="${nutTop-3}" text-anchor="middle" font-size="8" font-weight="700" fill="#e94560">C${capoFret}</text>`);
      }
      p.push(`<line x1="${nutX-1}" y1="${strY[0]}" x2="${nutX-1}" y2="${strY[nStrings-1]}" stroke="#1a2d46" stroke-width="1" stroke-dasharray="3 3"/>`);

      function drawDot(fret, sIdx, style) {
        const x = cx(fret), y = strY[sIdx];
        if (fret === 0) {
          p.push(`<circle cx="${x}" cy="${y}" r="${dotR}" fill="${style.fill}" fill-opacity="0.15" stroke="${style.stroke}" stroke-width="1.5"/>`);
          p.push(`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="8" font-weight="700" fill="${style.stroke}">${style.label}</text>`);
        } else {
          p.push(`<circle cx="${x}" cy="${y}" r="${dotR}" fill="${style.fill}"/>`);
          p.push(`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">${style.label}</text>`);
        }
      }

      if (!parsed) { p.push('</svg>'); return p.join(''); }

      // ── First-position chord mode ──────────────────────────────────
      let effectiveMode = mode;
      if (mode === 'chord') {
        const chordMap = COWBOY_CHORDS[instr];
        if (chordMap) {
          // With capo at fret N, the player must finger a shape N semitones LOWER
          // than the target chord. E.g. E Major at capo 2 → finger D Major shape.
          // (D shape + capo raising pitch by 2 semitones = E Major sounding.)
          let lookupName;
          if (capoFret > 0) {
            const transRoot = (parsed.rootSemitone - capoFret + 12) % 12;
            const rootName  = SEMITONE_TO_NOTE[transRoot];
            lookupName = /7\s*$/.test(parsed.name)
              ? rootName + '7'
              : rootName + (parsed.isMinor ? ' Minor' : ' Major');
          } else {
            lookupName = parsed.name;
          }
          const voicing = chordMap[lookupName];
          if (voicing) {
            // Mark muted strings with an X
            cfg.strings.forEach((_, sIdx) => {
              if (!voicing.some(v => v.s === sIdx)) {
                const y = strY[sIdx];
                p.push(`<line x1="${openX-4}" y1="${y-4}" x2="${openX+4}" y2="${y+4}" stroke="#5a6480" stroke-width="1.5"/>`);
                p.push(`<line x1="${openX+4}" y1="${y-4}" x2="${openX-4}" y2="${y+4}" stroke="#5a6480" stroke-width="1.5"/>`);
              }
            });
            // Draw chord voicing dots (back-to-front so root appears on top)
            [...voicing].reverse().forEach(({s, fret, iv}) => {
              const style = { ...INTERVAL_STYLE[iv] };
              if (iv === 'third' && parsed.isMinor) style.label = '\u266d3';
              drawDot(fret, s, style);
            });
            p.push('</svg>');
            return p.join('');
          }
        }
        // Non-guitar or unknown chord: fall back to root-third-fifth intervals
        effectiveMode = 'root-third-fifth';
      }

      const semitones = {
        root:    parsed.rootSemitone,
        third:   parsed.thirdSemitone,
        fifth:   parsed.fifthSemitone,
        seventh: parsed.seventhSemitone,
      };

      // Draw back-to-front so root appears on top
      const intervals = activeIntervals(effectiveMode);
      [...intervals].reverse().forEach(interval => {
        const st = semitones[interval];
        if (st === undefined) return;
        const style = { ...INTERVAL_STYLE[interval] };
        if (interval === 'third' && parsed.isMinor) style.label = '\u266d3';
        getPositions(st, instr, capoFret).forEach(({s, fret}) => drawDot(fret, s, style));
      });

      p.push('</svg>');
      return p.join('');
    }

    // ── Legend ────────────────────────────────────────────────────────
    const LEGEND_LABELS = {
      root:    'Root (1)',
      third:   'Third (3)',
      fifth:   'Fifth (5)',
      seventh: '\u266d7th',   // flat 7 by convention
    };

    function updateLegend(parsed, mode) {
      const intervals = activeIntervals(mode);
      legendEl.innerHTML = intervals.map(iv => {
        let label = LEGEND_LABELS[iv];
        if (parsed?.isMinor && iv === 'third') label = '\u266d3rd (minor)';
        return `<span class="legend-item"><span class="legend-pip ${iv}"></span>${label}</span>`;
      }).join('');
    }

    // ── Initial render ────────────────────────────────────────────────
    updateLegend(null, notesMode, instrument, capo);
    renderBassPanel(-1);
    renderLyrics(-1);
  </script>

</body>
</html>
